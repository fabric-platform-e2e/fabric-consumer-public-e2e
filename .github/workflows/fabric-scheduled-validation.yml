name: Fabric scheduled validation
run-name: remaining-${{ github.event_name }}-${{ github.event.action || 'default' }}
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        label: [actions-fabric-linux-x64, actions-fabric-windows-x64, actions-fabric-macos-x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: main
      - run: node --test platform-fixture/ledger.test.mjs
      - name: Validate native event context
        run: node platform-fixture/remaining.mjs
