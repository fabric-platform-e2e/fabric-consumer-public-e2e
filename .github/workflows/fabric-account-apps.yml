name: Fabric App ownership compatibility
on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        type: string
      expect_hit:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        label: [actions-fabric-linux-x64, actions-fabric-windows-x64, actions-fabric-macos-x64]
    outputs:
      verified: ${{ steps.build.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        id: cache
        with:
          path: .platform-cache
          key: fabric-platform-${{ matrix.label }}-${{ inputs.cache_key }}
      - name: Execute portable invoice test suite
        run: node --test platform-fixture/ledger.test.mjs
      - name: Validate OS, isolation, cache and build report
        id: build
        env:
          EXPECTED_LABEL: ${{ matrix.label }}
          EXPECT_HIT: ${{ inputs.expect_hit }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: node platform-fixture/report.mjs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-${{ matrix.label }}
          path: platform-results/*.json
          retention-days: 1
  verify:
    needs: build
    runs-on: actions-fabric-linux-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: platform-*
          path: platform-results
          merge-multiple: true
      - name: Verify cross-platform artifacts and native job output
        env:
          VERIFIED: ${{ needs.build.outputs.verified }}
        run: |
          node -e "require('node:assert/strict').equal(process.env.VERIFIED,'true')"
          node platform-fixture/report.mjs verify
