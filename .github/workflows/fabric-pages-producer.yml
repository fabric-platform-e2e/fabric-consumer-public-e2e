name: Fabric custom Pages deployment
on:
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  pages:
    runs-on: actions-fabric-linux-x64
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test platform-fixture/ledger.test.mjs
      - name: Build verified static invoice report
        run: |
          node --input-type=module -e "import {invoice} from './platform-fixture/ledger.mjs';import {mkdirSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';const total=invoice([['19.99',3],['0.10',7]]);assert.equal(total,'60.67');mkdirSync('.fabric-pages-site',{recursive:true});writeFileSync('.fabric-pages-site/index.html','<!doctype html><title>Fabric validation</title><h1>Validated invoice</h1><p>'+total+'</p>');"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .fabric-pages-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
